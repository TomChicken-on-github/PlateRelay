# 设计层文档 2 · 接口契约。由人维护；改接口先改这里（Q150）。
openapi: 3.1.0
info:
  title: PlateRelay API
  version: 1.0.0-draft
  description: |-
    设计层文档 2 的接口契约，设计先行、手写，是接口的唯一来源（Q150）。

    - 通用约定（认证、错误、幂等、并发、分页、实时推送）见 http-api.md，这里不重复。
    - `x-permission`：文档 1 §2.2 的权限节点，或 public / guest / authenticated（API-PERM）。数组表示满足任意一个；`order:submit` 出现在需要"本人"的操作上时，服务端还会检查订单所有者。
    - `x-transitions`：可能触发的文档 1 状态转换（API-CONC-03）。
    - `x-rules`：相关的文档 0 / 1 / 2 编号。
    - `x-requires`：字段级权限裁剪，没权限时字段不出现（API-PERM-04）。
    - 重写时实体结构挪到 packages/shared/schema/，这里改成 $ref（README.md）。
  license: {name: GPL-3.0-only, identifier: GPL-3.0-only}
servers:
- {url: /api/v1}
tags:
- {name: auth}
- {name: me}
- {name: files}
- {name: orders}
- {name: queue}
- {name: printers}
- {name: pickup}
- {name: overview}
- {name: catalog}
- {name: admin}
- {name: notifications}
- {name: stream}
paths:
  /auth/methods:
    get:
      operationId: getAuthMethods
      tags: [auth]
      summary: 可用的注册和登录方式
      x-permission: public
      x-rules: [R-ACC-01]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthMethods'}
        default: {$ref: '#/components/responses/Problem'}
  /setup:
    post:
      operationId: setup
      tags: [auth]
      summary: 初始化向导：创建第一个管理员
      x-permission: public
      description: 只在系统里还没有用户时可用，之后返回 404（F-ACC-04）。
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: {type: string}
                password: {type: string, minLength: 8}
                displayName: {type: string}
                orgName: {type: string}
                timezone: {type: string}
              required: [username, password, displayName, orgName, timezone]
              additionalProperties: false
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        default: {$ref: '#/components/responses/Problem'}
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: 用户名密码登录
      x-permission: public
      x-rules: [R-ACC-04, API-RATE-01, API-AUTH-06]
      description: 成功时设置会话 Cookie（API-AUTH-01）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: {type: string}
                password: {type: string}
                captcha:
                  type: object
                  properties:
                    challengeId: {type: string}
                    answer: {type: string}
                  required: [challengeId, answer]
                  additionalProperties: false
              required: [username, password]
              additionalProperties: false
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        default: {$ref: '#/components/responses/Problem'}
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: 退出登录
      x-permission: authenticated
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        default: {$ref: '#/components/responses/Problem'}
  /auth/captcha:
    post:
      operationId: issueCaptcha
      tags: [auth]
      summary: 领一个人机验证挑战
      x-permission: public
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
              additionalProperties: false
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  challengeId: {type: string}
                  payload: {}
                required: [challengeId, payload]
                additionalProperties: false
        default: {$ref: '#/components/responses/Problem'}
  /auth/otp:
    post:
      operationId: sendOtp
      tags: [auth]
      summary: 发送短信或邮件验证码
      x-permission: public
      x-rules: [R-ACC-02, R-ACC-03, API-RATE-02]
      description: 短信一律要 captcha；邮件按 CFG-ACC-03，需要而没带时返回 422 captcha_required。
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channel: {type: string, enum: [SMS, EMAIL]}
                target: {type: string}
                purpose: {type: string, enum: [REGISTER, VERIFY_EMAIL, RESET_PASSWORD]}
                captcha:
                  type: object
                  properties:
                    challengeId: {type: string}
                    answer: {type: string}
                  required: [challengeId, answer]
                  additionalProperties: false
              required: [channel, target, purpose]
              additionalProperties: false
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        default: {$ref: '#/components/responses/Problem'}
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: 注册
      x-permission: public
      x-rules: [R-ACC-01]
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                method: {type: string, enum: [OPEN, INVITE, PHONE]}
                username: {type: string}
                password: {type: string, minLength: 8}
                displayName: {type: string}
                email: {type: string}
                inviteCode: {type: string}
                phone: {type: string}
                otp: {type: string}
              required: [method, username, displayName]
              additionalProperties: false
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        default: {$ref: '#/components/responses/Problem'}
  /auth/oidc/{provider}/start:
    get:
      operationId: oidcStart
      tags: [auth]
      summary: 跳转到外部登录
      x-permission: public
      parameters:
      - name: provider
        in: path
        required: true
        schema: {type: string}
      responses:
        '302': {description: 跳到提供方}
        default: {$ref: '#/components/responses/Problem'}
  /auth/oidc/{provider}/callback:
    get:
      operationId: oidcCallback
      tags: [auth]
      summary: 外部登录回调
      x-permission: public
      parameters:
      - name: provider
        in: path
        required: true
        schema: {type: string}
      - name: code
        in: query
        schema: {type: string}
      - name: state
        in: query
        schema: {type: string}
      responses:
        '302': {description: 登录完成，跳回界面}
        default: {$ref: '#/components/responses/Problem'}
  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: 当前用户和权限
      x-permission: authenticated
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateMe
      tags: [me]
      summary: 改显示名、界面语言
      x-permission: authenticated
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version: {type: integer}
                displayName: {type: string}
                locale: {type: string, enum: [zh-CN, en]}
              required: [version]
              additionalProperties: false
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        default: {$ref: '#/components/responses/Problem'}
  /me/password:
    put:
      operationId: changePassword
      tags: [me]
      summary: 改密码
      x-permission: authenticated
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current: {type: string}
                next: {type: string, minLength: 8}
              required: [current, next]
              additionalProperties: false
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        default: {$ref: '#/components/responses/Problem'}
  /me/avatar:
    put:
      operationId: setAvatar
      tags: [me]
      summary: 换头像
      x-permission: authenticated
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: {type: string, contentMediaType: image/*}
              required: [file]
              additionalProperties: false
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        default: {$ref: '#/components/responses/Problem'}
  /me/notification-prefs:
    get:
      operationId: getNotificationPrefs
      tags: [me]
      summary: 个人通知设置
      x-permission: authenticated
      x-rules: [R-NTF-02]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/NotificationPref'}
        default: {$ref: '#/components/responses/Problem'}
    put:
      operationId: setNotificationPrefs
      tags: [me]
      summary: 保存个人通知设置
      x-permission: authenticated
      x-rules: [R-NTF-02]
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prefs:
                  type: array
                  items: {$ref: '#/components/schemas/NotificationPref'}
              required: [prefs]
              additionalProperties: false
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/NotificationPref'}
        default: {$ref: '#/components/responses/Problem'}
  /files:
    post:
      operationId: uploadFile
      tags: [files]
      summary: 上传 .gcode.3mf
      x-permission: order:submit
      x-rules: [R-SUB-01, R-SUB-02, API-FILE-01]
      description: 返回时校验通常还没完成，等 file.checked 推送或轮询。
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: {type: string, contentMediaType: application/octet-stream}
              required: [file]
              additionalProperties: false
      responses:
        '202':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileCheck'}
        default: {$ref: '#/components/responses/Problem'}
  /files/{fileId}/check:
    get:
      operationId: getFileCheck
      tags: [files]
      summary: 解析和校验结果
      x-permission: order:submit
      description: 只能查自己上传的。
      parameters:
      - name: fileId
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileCheck'}
        default: {$ref: '#/components/responses/Problem'}
  /orders:
    post:
      operationId: submitOrders
      tags: [orders]
      summary: 提交：每盘一个订单
      x-permission: order:submit
      x-transitions: [S-ORD-T01]
      x-rules: [R-SUB-02, R-SUB-05, R-SUB-06, R-SUB-07, R-SUB-08, R-SUB-09, R-ARB-05]
      description: 多盘一次提交，超过排队上限整次拒绝（R-ARB-05）。表单版本不是最新时返回 409 version_conflict。
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fileId: {type: string, format: uuid}
                plates:
                  type: array
                  items: {type: integer, minimum: 1}
                  minItems: 1
                colourPref: {$ref: '#/components/schemas/ColourPref'}
                bedType: {type: [string, 'null']}
                formVersionId: {type: string, format: uuid}
                answers:
                  type: array
                  items:
                    type: object
                    properties:
                      fieldId: {type: string}
                      value: {}
                    required: [fieldId, value]
                    additionalProperties: false
              required: [fileId, plates, colourPref, formVersionId, answers]
              additionalProperties: false
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items: {$ref: '#/components/schemas/OrderSummary'}
                required: [orders]
                additionalProperties: false
        default: {$ref: '#/components/responses/Problem'}
    get:
      operationId: listOrders
      tags: [orders]
      summary: 全部订单（订单管理）
      x-permission: order:view:any
      description: 按提交时间倒序（Q99）。
      parameters:
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Cursor'}
      - name: status
        in: query
        schema: {type: string}
      - name: ownerId
        in: query
        schema: {type: string, format: uuid}
      - name: printerId
        in: query
        schema: {type: string, format: uuid}
      - name: number
        in: query
        schema: {type: integer}
      - name: q
        in: query
        schema: {type: string}
        description: 搜文件名、申请者
      - name: submittedFrom
        in: query
        schema: {type: string, format: date-time}
      - name: submittedTo
        in: query
        schema: {type: string, format: date-time}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/OrderSummary'}
                  nextCursor: {type: [string, 'null']}
                required: [items, nextCursor]
                additionalProperties: false
        default: {$ref: '#/components/responses/Problem'}
  /orders/mine:
    get:
      operationId: listMyOrders
      tags: [orders]
      summary: 我的订单
      x-permission: order:submit
      description: 按提交时间倒序。
      parameters:
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Cursor'}
      - name: status
        in: query
        schema: {type: string}
        description: 逗号分隔的状态
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/OrderSummary'}
                  nextCursor: {type: [string, 'null']}
                required: [items, nextCursor]
                additionalProperties: false
        default: {$ref: '#/components/responses/Problem'}
  /orders/{orderId}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: 订单详情
      x-permission: ['order:submit', 'order:view:any']
      description: 本人或 order:view:any；看不到返回 404（API-PERM-05）。
      parameters:
      - {$ref: '#/components/parameters/OrderId'}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderDetail'}
        default: {$ref: '#/components/responses/Problem'}
  /orders/{orderId}/records:
    get:
      operationId: listOrderRecords
      tags: [orders]
      summary: 订单时间线记录
      x-permission: ['order:submit', 'order:view:any']
      x-rules: [R-NTE-01, R-NTE-02, R-VIS-07]
      description: 按时间正序。申请者只收到选手可见的备注。
      parameters:
      - {$ref: '#/components/parameters/OrderId'}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/OrderRecord'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: addDeviceStopNote
      tags: [orders]
      summary: 给"在设备端停止"补一条备注
      x-permission: printer:operate
      x-rules: [R-NTE-01, R-NTE-03]
      description: 只能指向 kind=print.stopped_on_device 的记录。记录只追加（E-GEN-10），所以备注是一条新记录 note.added，data.refRecordId 指向原记录，归在"打印"节点下（Q217）。
      parameters:
      - {$ref: '#/components/parameters/OrderId'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refRecordId: {type: string, format: uuid}
                note: {type: string, minLength: 1, maxLength: 2000}
                noteVisible: {type: boolean, default: false}
              required: [refRecordId, note]
              additionalProperties: false
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderRecord'}
        default: {$ref: '#/components/responses/Problem'}
  /orders/{orderId}/versions/{n}/file:
    get:
      operationId: downloadVersionFile
      tags: [orders]
      summary: 下载某个版本的文件
      x-permission: ['order:submit', 'order:view:any']
      x-rules: [R-FIL-01]
      parameters:
      - {$ref: '#/components/parameters/OrderId'}
      - {$ref: '#/components/parameters/VersionN'}
      responses:
        '302': {description: 跳到签名链接（API-FILE-02）}
        default: {$ref: '#/components/responses/Problem'}
  /orders/{orderId}/parts:
    get:
      operationId: getOrderParts
      tags: [orders]
      summary: 零件列表和图（跳过零件用）
      x-permission: ['order:skip-parts:own', 'order:skip-parts:any']
      parameters:
      - {$ref: '#/components/parameters/OrderId'}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  parts:
                    type: array
                    items: {$ref: '#/components/schemas/Part'}
                  topUrl: {type: [string, 'null'], format: uri}
                  pickUrl: {type: [string, 'null'], format: uri}
                  skipped:
                    type: array
                    items: {type: integer}
                required: [parts, topUrl, pickUrl, skipped]
                additionalProperties: false
        default: {$ref: '#/components/responses/Problem'}
  /orders/{orderId}/approve:
    post:
      operationId: approveOrder
      tags: [orders]
      summary: 审核通过
      x-permission: order:review
      x-transitions: [S-ORD-T02]
      x-rules: [R-REV-01, R-REV-04, R-REV-05]
      description: versionId 是审核人看到的那个待审版本，防止审了一个版本却通过了另一个。
      parameters:
      - {$ref: '#/components/parameters/OrderId'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expectedStatus: {$ref: '#/components/schemas/OrderStatus'}
                versionId: {type: string, format: uuid}
                note: {type: [string, 'null'], maxLength: 2000, description: 备注（R-NTE-03）}
              required: [expectedStatus, versionId]
              additionalProperties: false
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderDetail'}
        default: {$ref: '#/components/responses/Problem'}
  /orders/{orderId}/reject:
    post:
      operationId: rejectOrder
      tags: [orders]
      summary: 驳回（新提交或修改）
      x-permission: order:review
      x-transitions: [S-ORD-T03, S-ORD-T04]
      x-rules: [R-REV-02, R-REV-03]
      parameters:
      - {$ref: '#/components/parameters/OrderId'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expectedStatus: {$ref: '#/components/schemas/OrderStatus'}
                versionId: {type: string, format: uuid}
                reason: {type: string, minLength: 1, maxLength: 2000}
                reasonVisible: {type: boolean, default: true}
              required: [expectedStatus, versionId, reason]
              additionalProperties: false
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderDetail'}
        default: {$ref: '#/components/responses/Problem'}
  /orders/{orderId}/versions:
    post:
      operationId: reviseOrder
      tags: [orders]
      summary: 修改文件（上传新版本）
      x-permission: order:submit
      x-transitions: [S-ORD-T06]
      x-rules: [R-VER-01, R-VER-02, R-VER-04, R-VER-07, R-VER-08, R-VER-09, R-VER-10, CFG-REV-01]
      description: 只限本人。第一次审核前是替换（R-VER-01）；已派单及之后不能修改，返回 422 rule_violation（R-VER-04、R-VER-08，Q207）。
      parameters:
      - {$ref: '#/components/parameters/OrderId'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expectedStatus: {$ref: '#/components/schemas/OrderStatus'}
                fileId: {type: string, format: uuid}
                plate: {type: integer, minimum: 1}
              required: [expectedStatus, fileId, plate]
              additionalProperties: false
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderDetail'}
        default: {$ref: '#/components/responses/Problem'}
  /orders/{orderId}/versions/withdraw:
    post:
      operationId: withdrawRevision
      tags: [orders]
      summary: 撤回修改
      x-permission: order:submit
      x-transitions: [S-ORD-T05]
      x-rules: [R-VER-05]
      description: 只限本人。
      parameters:
      - {$ref: '#/components/parameters/OrderId'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expectedStatus: {$ref: '#/components/schemas/OrderStatus'}
                versionId: {type: string, format: uuid}
              required: [expectedStatus, versionId]
              additionalProperties: false
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderDetail'}
