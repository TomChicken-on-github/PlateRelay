        schema: {type: string, format: uuid}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version: {type: integer}
                name: {type: string}
              required: [version, name]
              additionalProperties: false
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Daemon'}
        default: {$ref: '#/components/responses/Problem'}
  /daemons/{daemonId}/revoke:
    post:
      operationId: revokeDaemon
      tags: [admin]
      summary: 吊销
      x-permission: daemon:manage
      description: 立刻断开它的连接；它名下的打印机挂失联，要管理员移到别的 daemon（INV-09）。
      parameters:
      - name: daemonId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version: {type: integer}
                reason: {type: string, minLength: 1}
              required: [version, reason]
              additionalProperties: false
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Daemon'}
        default: {$ref: '#/components/responses/Problem'}
  /daemons/{daemonId}/public-key:
    get:
      operationId: getDaemonPublicKey
      tags: [admin]
      summary: daemon 公钥（浏览器加密访问码用）
      x-permission: printer:manage
      parameters:
      - name: daemonId
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  publicKey: {type: string, description: SPKI DER base64}
                  keyFingerprint: {type: string}
                required: [publicKey, keyFingerprint]
                additionalProperties: false
        default: {$ref: '#/components/responses/Problem'}
  /daemons/{daemonId}/discovered:
    get:
      operationId: listDiscovered
      tags: [admin]
      summary: 这个 daemon 听到的打印机
      x-permission: printer:manage
      x-rules: [F-PRT-12]
      parameters:
      - name: daemonId
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/DiscoveredPrinter'}
        default: {$ref: '#/components/responses/Problem'}
  /form:
    get:
      operationId: getForm
      tags: [admin]
      summary: 当前申请表单
      x-permission: ['order:submit', 'form:configure']
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Form'}
        default: {$ref: '#/components/responses/Problem'}
    put:
      operationId: saveForm
      tags: [admin]
      summary: 保存申请表单（新版本）
      x-permission: form:configure
      description: basedOnVersionId 不是最新版本时返回 409 version_conflict（E-FORM）。
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                basedOnVersionId: {type: string, format: uuid}
                fields:
                  type: array
                  items: {$ref: '#/components/schemas/FormField'}
              required: [basedOnVersionId, fields]
              additionalProperties: false
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Form'}
        default: {$ref: '#/components/responses/Problem'}
  /settings/public:
    get:
      operationId: getPublicSettings
      tags: [admin]
      summary: 界面需要的公开设置
      x-permission: public
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicSettings'}
        default: {$ref: '#/components/responses/Problem'}
  /settings:
    get:
      operationId: getSettings
      tags: [admin]
      summary: 系统设置（全部分区）
      x-permission: ['settings:manage', 'resource:configure']
      description: 只有 resource:configure 的人只收到 mapping 分区。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/SettingsSection'}
        default: {$ref: '#/components/responses/Problem'}
  /settings/{section}:
    put:
      operationId: saveSettingsSection
      tags: [admin]
      summary: 按分区保存
      x-permission: ['settings:manage', 'resource:configure']
      x-rules: [F-OPS-06, P-04]
      description: mapping 分区要 resource:configure，其他要 settings:manage。范围和关联校验失败返回 422。
      parameters:
      - name: section
        in: path
        required: true
        schema: {type: string}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version: {type: integer}
                values: {type: object, additionalProperties: true}
                confirm: {type: string, enum: ['true'], description: 前端已显示改前改后并经确认（F-OPS-06）}
              required: [version, values, confirm]
              additionalProperties: false
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SettingsSection'}
        default: {$ref: '#/components/responses/Problem'}
  /audit:
    get:
      operationId: listAudit
      tags: [admin]
      summary: 审计日志
      x-permission: audit:view
      description: 按时间倒序。
      parameters:
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Cursor'}
      - name: action
        in: query
        schema: {type: string}
      - name: actorId
        in: query
        schema: {type: string, format: uuid}
      - name: targetType
        in: query
        schema: {type: string}
      - name: targetId
        in: query
        schema: {type: string}
      - name: from
        in: query
        schema: {type: string, format: date-time}
      - name: to
        in: query
        schema: {type: string, format: date-time}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/AuditEntry'}
                  nextCursor: {type: [string, 'null']}
                required: [items, nextCursor]
                additionalProperties: false
        default: {$ref: '#/components/responses/Problem'}
  /archive:
    post:
      operationId: archivePeriod
      tags: [admin]
      summary: 归档本期
      x-permission: settings:manage
      x-transitions: [S-ORD-T21, S-ORD-T22]
      x-rules: [R-ARC-01, R-ARC-02, R-ARB-01, R-ARB-02]
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm: {type: string, enum: ['true']}
                export: {type: boolean}
              required: [confirm, export]
              additionalProperties: false
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  archiveId: {type: string, format: uuid}
                  cancelled: {type: integer}
                  disposed: {type: integer}
                  exportUrl: {type: [string, 'null'], format: uri}
                required: [archiveId, cancelled, disposed, exportUrl]
                additionalProperties: false
        default: {$ref: '#/components/responses/Problem'}
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: 我的通知
      x-permission: authenticated
      parameters:
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Cursor'}
      - name: unread
        in: query
        schema: {type: boolean}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Notification'}
                  nextCursor: {type: [string, 'null']}
                required: [items, nextCursor]
                additionalProperties: false
        default: {$ref: '#/components/responses/Problem'}
  /notifications/read:
    post:
      operationId: markNotificationsRead
      tags: [notifications]
      summary: 标为已读
      x-permission: authenticated
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items: {type: string, format: uuid}
                all: {type: boolean}
              additionalProperties: false
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        default: {$ref: '#/components/responses/Problem'}
  /stream:
    get:
      operationId: stream
      tags: [stream]
      summary: 实时推送（SSE）
      x-permission: [guest, authenticated]
      x-rules: [API-RT-01, API-RT-04, API-RT-06]
      parameters:
      - name: Last-Event-ID
        in: header
        schema: {type: string}
      responses:
        '200':
          description: text/event-stream；事件见 http-api.md §9
          content:
            text/event-stream:
              schema: {type: string}
        default: {$ref: '#/components/responses/Problem'}
components:
  schemas:
    Problem:
      type: object
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        code: {type: string, description: 错误码，见 http-api.md §4.2}
        detail: {type: string}
        rule: {type: string, description: 违反的文档 1 规则编号，如 R-VER-09}
        params: {type: object, additionalProperties: true}
        requestId: {type: string}
        errors:
          type: array
          items:
            type: object
            properties:
              path: {type: string}
              code: {type: string}
              params: {type: object, additionalProperties: true}
            required: [path, code]
            additionalProperties: false
      required: [type, title, status, code, requestId]
      additionalProperties: false
    CommandAccepted:
      type: object
      properties:
        commandId: {type: string, format: uuid}
        printerId: {type: string, format: uuid}
        flag:
          oneOf:
          - {$ref: '#/components/schemas/PrinterFlag'}
          - {type: 'null'}
      required: [commandId, printerId, flag]
      additionalProperties: false
      description: API-ASYNC-01：命令已记下并发出。结果通过实时推送到达。
    Person:
      type: object
      properties:
        id: {type: [string, 'null'], format: uuid}
        name: {type: string}
        avatarUrl: {type: [string, 'null'], format: uri}
      required: [id, name, avatarUrl]
      additionalProperties: false
      description: 显示名和头像（order:submitter-name:view-others）。系统动作时 id 为 null。
    Role: {type: string, enum: [APPLICANT, STAFF, ADMIN]}
    OrderStatus:
      type: string
      enum:
      - PENDING_REVIEW
      - REJECTED
      - QUEUED
      - DISPATCHED
      - PRINTING
      - FAILED
      - PRINTED
      - READY
      - COMPLETED
      - CANCELLED
      - DISPOSED
      description: entities.md §2.1
    PrinterState:
      type: string
      enum: [OFFLINE, IDLE, PREPARING, PRINTING, PAUSED, CLEARING_REQUIRED, EXTERNAL, MAINTENANCE]
      description: entities.md §2.2
    PrinterFlag:
      type: string
      enum: [ATTENTION, STOPPING, LOST, STORAGE_LOW, DAEMON_UPGRADE]
    PauseReason: {type: string, enum: [USER, ERROR, RUNOUT]}
    ColourPref: {type: string, enum: [EXACT, SIMILAR, ANY]}
    ProcessNode: {type: string, enum: [SUBMIT, REVIEW, QUEUE, PRINT, STORE, PICKUP]}
    NodeState: {type: string, enum: [NOT_REACHED, ACTIVE, DONE, PROBLEM]}
    VersionKind: {type: string, enum: [SUBMIT, REPLACE, REVISION, RESTORE]}
    VersionState: {type: string, enum: [PENDING, APPROVED, REJECTED, WITHDRAWN, REPLACED]}
    Permission: {type: string, description: 文档 1 §2.2 的权限节点}
    Nozzle:
      type: object
      properties:
        extruder: {type: integer, minimum: 1}
        side: {type: [string, 'null'], enum: [LEFT, RIGHT]}
        diameterMm: {type: number}
        flow: {type: [string, 'null'], enum: [STANDARD, HIGH]}
      required: [extruder, side, diameterMm, flow]
      additionalProperties: false
    SliceFilament:
      type: object
      properties:
        slot: {type: integer, minimum: 1}
        extruder: {type: [integer, 'null']}
        material: {type: string}
        subType: {type: [string, 'null']}
        colour: {type: string, pattern: '^#[0-9A-F]{6}$'}
        usedGrams: {type: number}
      required: [slot, extruder, material, subType, colour, usedGrams]
      additionalProperties: false
    Part:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
      required: [id, name]
      additionalProperties: false
    Plate:
      type: object
      properties:
        index: {type: integer, minimum: 1}
        name: {type: string}
        modelId: {type: string}
        modelName: {type: [string, 'null']}
        nozzles:
          type: array
          items: {$ref: '#/components/schemas/Nozzle'}
        filaments:
          type: array
          items: {$ref: '#/components/schemas/SliceFilament'}
        printSeconds: {type: integer, minimum: 0}
        weightGrams: {type: number}
        thumbnailUrl: {type: [string, 'null'], format: uri}
        parts:
          type: array
          items: {$ref: '#/components/schemas/Part'}
        submittable: {type: boolean, description: 机型、喷嘴能对上开放的打印机（R-SUB-05）}
        hints:
          type: array
          items:
            type: object
            properties:
              code: {type: string}
              params: {type: object, additionalProperties: true}
            required: [code, params]
            additionalProperties: false
          description: 提交页提示：耗材不在目录（R-SUB-06）、颜色缺失（R-SUB-07）、双喷头只用一个……
      required:
      - index
      - name
      - modelId
      - modelName
      - nozzles
      - filaments
      - printSeconds
      - weightGrams
      - thumbnailUrl
      - parts
      - submittable
      - hints
      additionalProperties: false
    Finding:
      type: object
      properties:
        check: {type: string, enum: [structure, consistency, bounds, dangerous]}
        code: {type: string}
        severity: {type: string, enum: [REJECT, WARN]}
        plate: {type: [integer, 'null']}
        detail: {type: object, additionalProperties: true}
      required: [check, code, severity, plate, detail]
      additionalProperties: false
    FileCheck:
      type: object
      properties:
        fileId: {type: string, format: uuid}
        fileName: {type: string}
        sizeBytes: {type: integer}
        status: {type: string, enum: [QUEUED, RUNNING, DONE, ERROR]}
        verdict: {type: [string, 'null'], enum: [PASS, WARN, REJECT]}
        plates:
          type: array
          items: {$ref: '#/components/schemas/Plate'}
        findings:
          type: array
          items: {$ref: '#/components/schemas/Finding'}
          description: 申请者只看到拒收项；警告项只给审核人（R-VIS-08）
      required: [fileId, fileName, sizeBytes, status, verdict, plates, findings]
      additionalProperties: false
    Answer:
      type: object
      properties:
        fieldId: {type: string}
        label: {type: string}
        type: {$ref: '#/components/schemas/FormFieldType'}
        value:
          oneOf:
          - {type: string}
          - type: array
            items: {type: string}
          - {type: number}
          - {type: 'null'}
      required: [fieldId, label, type, value]
      additionalProperties: false
    OrderVersion:
      type: object
      properties:
        id: {type: string, format: uuid}
        n: {type: integer, minimum: 1}
        kind: {$ref: '#/components/schemas/VersionKind'}
        state: {$ref: '#/components/schemas/VersionState'}
        restoredFromN: {type: [integer, 'null']}
        plate: {$ref: '#/components/schemas/Plate'}
        fileName: {type: string, x-requires: 'order:view:any'}
        deltaSeconds: {type: [integer, 'null']}
        placesBack: {type: [integer, 'null'], description: -1 = 队尾}
        counted: {type: boolean}
        modelSwitch: {type: boolean}
        createdAt: {type: string, format: date-time}
        decidedAt: {type: [string, 'null'], format: date-time}
        reason: {type: [string, 'null']}
        fileAvailable: {type: boolean, description: 文件没过保留期}
      required: [id, n, kind, state, plate, counted, modelSwitch, createdAt, fileAvailable]
      additionalProperties: false
    OrderSummary:
      type: object
      properties:
        id: {type: string, format: uuid}
        number: {type: integer}
        status: {$ref: '#/components/schemas/OrderStatus'}
        frozen: {type: boolean}
        owner: {$ref: '#/components/schemas/Person'}
        isMine: {type: boolean}
        fileName: {type: string, description: 'x-requires: order:view:any，本人也能看'}
        plate: {$ref: '#/components/schemas/Plate'}
        colourPref: {$ref: '#/components/schemas/ColourPref'}
        bedType: {type: [string, 'null']}
        submittedAt: {type: string, format: date-time}
        queue:
          type: [object, 'null']
          properties:
            position: {type: integer}
            ahead: {type: integer}
            wait:
              type: [object, 'null']
              properties:
                minSeconds: {type: integer, minimum: 0}
                maxSeconds: {type: integer, minimum: 0}
              required: [minSeconds, maxSeconds]
              additionalProperties: false
          required: [position, ahead, wait]
          additionalProperties: false
          description: 申请者只看到自己的排位和前面几单（R-VIS-01）；wait 受 queue:wait:view
        printer:
          type: [object, 'null']
          properties:
            id: {type: string, format: uuid}
            name: {type: string}
            state: {$ref: '#/components/schemas/PrinterState'}
            flags:
              type: array
              items: {$ref: '#/components/schemas/PrinterFlag'}
          required: [id, name, state, flags]
          additionalProperties: false
        progress:
          type: [object, 'null']
          properties:
            percent: {type: integer}
            remainingSeconds: {type: [integer, 'null'], minimum: 0}
          required: [percent, remainingSeconds]
          additionalProperties: false
      required: [id, number, status, frozen, owner, isMine, plate, colourPref, submittedAt]
      additionalProperties: false
    TimelineNode:
      type: object
      properties:
        node: {$ref: '#/components/schemas/ProcessNode'}
        state: {$ref: '#/components/schemas/NodeState'}
        label: {type: [string, 'null'], description: 审核节点：第 N 版 · 状态}
        note: {type: [string, 'null']}
      required: [node, state, label, note]
      additionalProperties: false
    OrderDetail:
      allOf:
      - {$ref: '#/components/schemas/OrderSummary'}
      - type: object
        properties:
          activeVersion: {$ref: '#/components/schemas/OrderVersion'}
          pendingVersion:
            oneOf:
            - {$ref: '#/components/schemas/OrderVersion'}
            - {type: 'null'}
          versions:
            type: array
            items: {$ref: '#/components/schemas/OrderVersion'}
          answers:
            type: array
            items: {$ref: '#/components/schemas/Answer'}
            description: 本人、审核人、管理员可见（R-VIS-05）
          revisions:
            type: object
            properties:
              used: {type: integer}
              max: {type: integer}
              modelSwitches: {type: integer}
              maxModelSwitches: {type: integer}
            required: [used, max, modelSwitches, maxModelSwitches]
            additionalProperties: false
          nodes:
            type: array
            items: {$ref: '#/components/schemas/TimelineNode'}
            description: 6 个流程节点（R-NTE-02）
          findings:
            type: array
            items: {$ref: '#/components/schemas/Finding'}
            description: 'x-requires: order:review（R-VIS-08）'
          storage:
            type: [object, 'null']
            description: 入库信息。入库照片订单本人也能看，前端放在入库节点下（R-VIS-09）
            properties:
              slot: {type: string}
              photoUrl: {type: [string, 'null'], format: uri, description: 短期签名链接（API-FILE-02），本人、现场人员、管理员可见（R-VIS-09）}
            required: [slot, photoUrl]
            additionalProperties: false
          parts:
            type: [object, 'null']
            properties:
              total: {type: integer}
              skipped:
                type: array
                items: {type: integer}
              canSkip: {type: boolean}
            required: [total, skipped, canSkip]
            additionalProperties: false
          actions:
            type: array
            items: {type: string}
            description: 当前用户此刻能做的操作的 operationId，前端据此显示按钮
          printJobs:
            type: array
            description: 打印记录：这个订单的每个打印任务，最新的在前（E-JOB、R-CAM-11、Q217、Q218）。任务阶段不单独显示。endPhoto 订单本人也能看，前端放在打印节点下；默认只展开最新一次，之前的折叠（R-VIS-09、Q222）
            items:
              type: object
              properties:
                jobId: {type: string, format: uuid}
                attempt: {type: integer, minimum: 1, description: 第 N 次}
                printerName: {type: string}
                startedAt: {type: [string, 'null'], format: date-time}
                endedAt: {type: [string, 'null'], format: date-time}
                outcome:
                  type: ['string', 'null']
                  enum: [SEND_FAILED, START_FAILED, STOPPED_BEFORE_START, FAILED, FINISHED, null]
                endPhoto:
                  type: [object, 'null']
                  properties:
                    capturedAt: {type: string, format: date-time}
                    url: {type: string, format: uri, description: 短期签名链接（API-FILE-02）}
                  required: [capturedAt, url]
                  additionalProperties: false
              required: [jobId, attempt, printerName, startedAt, endedAt, outcome, endPhoto]
              additionalProperties: false
          reprintBlockedReason: {type: [string, 'null'], description: 如 file_expired（R-PRT-10）、archived（R-PRT-09）、declined（R-PRT-18）}
          reprintDeclined:
            type: [object, 'null']
            description: 现场人员点了不重打（R-PRT-18）。reason 按 reasonVisible 对申请者裁剪（R-VIS-07）
            properties:
              at: {type: string, format: date-time}
              by:
                oneOf:
                - {$ref: '#/components/schemas/Person'}
                - {type: 'null'}
              reason: {type: [string, 'null']}
            required: [at, by, reason]
            additionalProperties: false
        required: [activeVersion, versions, revisions, nodes, actions]
        additionalProperties: false
    OrderRecord:
      type: object
      properties:
        id: {type: string, format: uuid}
        at: {type: string, format: date-time}
        node: {$ref: '#/components/schemas/ProcessNode'}
        kind: {type: string, description: 如 order.approved，见 E-REC}
        actor:
          oneOf:
          - {$ref: '#/components/schemas/Person'}
          - {type: 'null'}
        fromStatus:
          oneOf:
          - {$ref: '#/components/schemas/OrderStatus'}
          - {type: 'null'}
        toStatus:
          oneOf:
          - {$ref: '#/components/schemas/OrderStatus'}
          - {type: 'null'}
        versionN: {type: [integer, 'null']}
        note: {type: [string, 'null']}
        noteVisible: {type: boolean, description: 申请者只收到 noteVisible=true 的备注（R-VIS-07）}
        data: {type: object, additionalProperties: true}
      required: [id, at, node, kind, noteVisible, data]
      additionalProperties: false
    Timelapse:
      type: object
      properties:
        id: {type: string, format: uuid}
        part: {type: integer}
        sizeBytes: {type: integer}
        createdAt: {type: string, format: date-time}
      required: [id, part, sizeBytes, createdAt]
      additionalProperties: false
    QueueEntry:
      type: object
      properties:
        order: {$ref: '#/components/schemas/OrderSummary'}
        sortKey: {type: string}
        frozen: {type: boolean}
        bypassedSince: {type: [string, 'null'], format: date-time}
      required: [order, sortKey, frozen, bypassedSince]
      additionalProperties: false
    Suggestion:
      type: object
      properties:
        printerId: {type: string, format: uuid}
        orderId: {type: string, format: uuid}
      required: [printerId, orderId]
      additionalProperties: false
    TrayRef:
      type: object
      properties:
        unit: {type: integer, description: AMS 编号；外挂料 = -1}
        slot: {type: integer}
      required: [unit, slot]
      additionalProperties: false
    Tray:
      type: object
      properties:
        unit: {type: integer}
        slot: {type: integer}
        label: {type: string}
        material: {type: [string, 'null']}
        subType: {type: [string, 'null']}
        colour: {type: [string, 'null']}
        remainingPercent: {type: [integer, 'null']}
        extruders:
          type: array
          items: {type: integer}
      required: [unit, slot, label, extruders]
      additionalProperties: false
    MappingCheck:
      type: object
      properties:
        rule:
          type: string
          enum: [REACH, EMPTY, NOZZLE, DUPLICATE, MATERIAL, SUB_TYPE, COLOUR, REMAINING]
        result: {type: string, enum: [OK, WARN, BLOCK]}
        deltaE: {type: [number, 'null']}
      required: [rule, result]
      additionalProperties: false
      description: BLOCK = 物理约束（R-DSP-06）或配置为拦下（R-DSP-07）；物理约束没有放行
    MappingEntry:
      type: object
      properties:
        sliceSlot: {type: integer}
        extruder: {type: [integer, 'null']}
        tray: {$ref: '#/components/schemas/TrayRef'}
        mismatchReason: {type: [string, 'null'], description: CFG-MAP-05 里的一项；有 WARN 时必选}
        reasonVisibleToApplicant: {type: boolean, default: true}
      required: [sliceSlot, tray]
      additionalProperties: false
    DispatchOptions:
      type: object
      properties:
        printerId: {type: string, format: uuid}
        orderId: {type: string, format: uuid}
        feasible: {type: boolean}
        blockers:
          type: array
          items:
            type: object
            properties:
              code: {type: string}
              rule: {type: string}
            required: [code, rule]
            additionalProperties: false
          description: 不能派的原因
        bedType:
          type: object
          properties:
            reported: {type: [string, 'null']}
            required: {type: [string, 'null']}
            needsConfirmation: {type: boolean}
          required: [reported, required, needsConfirmation]
          additionalProperties: false
          description: R-DSP-09
        trays:
          type: array
          items: {$ref: '#/components/schemas/Tray'}
        proposal:
          type: array
          items:
            type: object
            properties:
              entry: {$ref: '#/components/schemas/MappingEntry'}
              checks:
                type: array
                items: {$ref: '#/components/schemas/MappingCheck'}
            required: [entry, checks]
            additionalProperties: false
        safety:
          type: object
          properties:
            verdict: {type: string, enum: [PASS, WARN, REJECT]}
            findings:
              type: array
              items: {$ref: '#/components/schemas/Finding'}
          required: [verdict, findings]
          additionalProperties: false
          description: 按当前限值复核（R-DSP-04）
        bypasses:
          type: array
          items: {type: string, format: uuid}
          description: 派这一单会越过的排队中订单（R-DSP-02）
      required: [printerId, orderId, feasible, blockers, bedType, trays, proposal, safety, bypasses]
      additionalProperties: false
    ActiveError:
      type: object
      properties:
        errorId: {type: string}
        vendorCode: {type: string}
        channel: {type: string}
        severity: {type: string, enum: [fatal, error, warning, info]}
        module: {type: [string, 'null']}
        message: {type: [string, 'null']}
        helpUrl: {type: [string, 'null']}
        actions:
          type: array
          items:
            type: object
            properties:
              action: {type: string}
              label: {type: string}
              requiresOnSite: {type: boolean}
              destructive: {type: boolean}
            required: [action, label, requiresOnSite, destructive]
            additionalProperties: false
        raisedAt: {type: string, format: date-time}
      required: [errorId, vendorCode, channel, severity, actions, raisedAt]
      additionalProperties: false
    ControlSpec:
      type: object
      properties:
        action: {type: string}
        category:
          type: string
          enum: [light, temperature, fan, speed, pause, resume, filament, dry, motion]
        args: {type: object, additionalProperties: true, description: 参数的 JSON Schema}
        destructive: {type: boolean}
        enabled: {type: boolean, description: 按 IF-ADP-05 算出的此刻能不能点}
      required: [action, category, args, destructive, enabled]
      additionalProperties: false
    PrinterCard:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        modelName: {type: [string, 'null']}
        state: {$ref: '#/components/schemas/PrinterState'}
        stateSince: {type: string, format: date-time}
        pauseReason:
          oneOf:
          - {$ref: '#/components/schemas/PauseReason'}
          - {type: 'null'}
        flags:
          type: array
          items: {$ref: '#/components/schemas/PrinterFlag'}
        starred: {type: boolean}
        openToApplicants: {type: boolean}
        pendingCommand:
          type: [object, 'null']
          description: API-ASYNC-04：锁着的那条控制命令（R-CMD-01–03）。不为空时，点过的按钮转加载圆环，除停止和设定值命令外的控制按钮置灰。
          properties:
            commandId: {type: string, format: uuid}
            kind: {type: string}
            sentAt: {type: string, format: date-time}
            unlockAt: {type: string, format: date-time, description: MSG-CMD-LOCK；到了没收到状态变化就按时间解锁并提示看摄像头}
          required: [commandId, kind, sentAt, unlockAt]
          additionalProperties: false
        pendingStop:
          type: [object, 'null']
          description: 最近一次还没确认的停止（Q211）。停止不受锁限制，可能和 pendingCommand 同时存在。
          properties:
            commandId: {type: string, format: uuid}
            sentAt: {type: string, format: date-time}
          required: [commandId, sentAt]
          additionalProperties: false
        job:
          type: [object, 'null']
          properties:
            orderId: {type: [string, 'null'], format: uuid}
            orderNumber: {type: [integer, 'null']}
            owner:
              oneOf:
              - {$ref: '#/components/schemas/Person'}
              - {type: 'null'}
            fileName: {type: string, description: 'x-requires: order:view:any（R-VIS-02）'}
            external: {type: boolean}
            percent: {type: [integer, 'null']}
            remainingSeconds: {type: [integer, 'null'], minimum: 0}
            layer: {type: [integer, 'null']}
            totalLayers: {type: [integer, 'null']}
          required: [orderId, orderNumber, owner, external, percent, remainingSeconds]
          additionalProperties: false
        temps:
          type: object
          additionalProperties:
            type: object
            properties:
              current: {type: number}
              target: {type: [number, 'null']}
            required: [current]
            additionalProperties: false
        camera:
          type: object
          properties:
            stream: {type: string, enum: [video, jpeg-frames, none]}
            snapshotAt: {type: [string, 'null'], format: date-time}
          required: [stream, snapshotAt]
          additionalProperties: false
          description: 卡片平时显示抓拍，点播放才申请实况（R-CAM-05）
        openable: {type: boolean, description: 能不能点开详情（R-VIS-04）}
      required: [id, name, state, stateSince, flags, starred, openToApplicants, camera, openable]
      additionalProperties: false
    PrinterDetail:
      allOf:
      - {$ref: '#/components/schemas/PrinterCard'}
      - type: object
        properties:
          brand: {type: string}
          serial: {type: string}
          host: {type: string}
          daemon:
            type: object
            properties:
              id: {type: string, format: uuid}
              name: {type: string}
              online: {type: boolean}
            required: [id, name, online]
            additionalProperties: false
          disabledAt: {type: [string, 'null'], format: date-time, description: 停用时间（R-PRT-20）}
          modelId: {type: [string, 'null']}
          nozzles:
            type: array
            items: {$ref: '#/components/schemas/Nozzle'}
          trays:
            type: array
            items: {$ref: '#/components/schemas/Tray'}
          bedType: {type: [string, 'null']}
          storage:
            type: array
            items:
              type: object
              properties:
                medium: {type: string, enum: [internal, sd, usb]}
                present: {type: boolean}
                writable: {type: boolean}
                freeBytes: {type: [integer, 'null']}
              required: [medium, present, writable, freeBytes]
              additionalProperties: false
          activeErrors:
            type: array
            items: {$ref: '#/components/schemas/ActiveError'}
          controls:
            type: array
            items: {$ref: '#/components/schemas/ControlSpec'}
          maintenanceReason: {type: [string, 'null']}
          accessCode:
            type: object
            properties:
              set: {type: boolean}
              keyMatches: {type: boolean}
            required: [set, keyMatches]
            additionalProperties: false
            description: 只说有没有，永远不返回访问码（INV-07）
          currentDispatchId: {type: [string, 'null'], format: uuid}
          version: {type: integer}
          lastReportAt: {type: [string, 'null'], format: date-time}
        required: [brand, serial, host, daemon, nozzles, trays, storage, activeErrors, controls, accessCode, version]
        additionalProperties: false
    DiscoveredPrinter:
      type: object
      properties:
        brand: {type: string}
        serial: {type: string}
        host: {type: string}
        modelId: {type: [string, 'null']}
        name: {type: [string, 'null']}
        lastSeenAt: {type: string, format: date-time}
        claimedBy:
          type: [object, 'null']
          properties:
            daemonId: {type: string, format: uuid}
            printerId: {type: string, format: uuid}
          required: [daemonId, printerId]
          additionalProperties: false
      required: [brand, serial, host, modelId, name, lastSeenAt, claimedBy]
      additionalProperties: false
    PickupCode:
      type: object
      properties:
        code: {type: string, description: 只在签发时返回一次（E-PCK）}
        expiresAt: {type: string, format: date-time}
      required: [code, expiresAt]
      additionalProperties: false
    PickupLookup:
      type: object
      properties:
        order: {$ref: '#/components/schemas/OrderSummary'}
        storageSlot: {type: string}
        photoUrl: {type: [string, 'null'], format: uri}
        codeExpiresAt: {type: string, format: date-time}
      required: [order, storageSlot, photoUrl, codeExpiresAt]
      additionalProperties: false
    Overview:
      type: object
      properties:
        printers:
          type: array
          items: {$ref: '#/components/schemas/PrinterCard'}
        queue:
          type: object
          properties:
            waiting: {type: integer}
            pendingReview: {type: integer, description: 'x-requires: order:review'}
          required: [waiting]
          additionalProperties: false
      required: [printers, queue]
      additionalProperties: false
    CatalogRow:
      type: object
      properties:
        id: {type: [string, 'null'], format: uuid}
        source: {type: string, enum: [AUTO, STOCK]}
        autoKey: {type: [string, 'null']}
        modelIds:
          type: array
          items: {type: string}
        material: {type: string}
        subType: {type: [string, 'null']}
        colour: {type: string}
        colourName: {type: [string, 'null']}
        loaded: {type: boolean, description: 已装上 / 需要换料（R-SUB-11）}
        hidden: {type: boolean}
        sort: {type: integer}
        note: {type: [string, 'null']}
        version: {type: [integer, 'null']}
      required: [id, source, autoKey, modelIds, material, subType, colour, colourName, loaded, hidden, sort, note, version]
      additionalProperties: false
    Resources:
      type: object
      properties:
        printers:
          type: array
          items:
            type: object
            properties:
              modelId: {type: string}
              modelName: {type: string}
              nozzles:
                type: array
                items: {$ref: '#/components/schemas/Nozzle'}
              count: {type: integer}
              available: {type: integer}
            required: [modelId, modelName, nozzles, count, available]
            additionalProperties: false
        catalog:
          type: array
          items: {$ref: '#/components/schemas/CatalogRow'}
        wait:
          type: [object, 'null']
          properties:
            minSeconds: {type: integer, minimum: 0}
            maxSeconds: {type: integer, minimum: 0}
          required: [minSeconds, maxSeconds]
          additionalProperties: false
        bedTypes:
          type: [array, 'null']
          items: {type: string}
          description: 自选板打开时可选（CFG-QUE-09）
      required: [printers, catalog, wait, bedTypes]
      additionalProperties: false
    TodoItem:
      type: object
      properties:
        kind:
          type: string
          enum:
          - REVIEW
          - STORE
          - ATTENTION
          - PAUSED_TOO_LONG
          - STOP_UNCONFIRMED
          - LOST
          - STORAGE_LOW
          - DAEMON_UPGRADE
          - BYPASSED
          - UNCLAIMED
          - CLEAR_BED
        since: {type: string, format: date-time}
        orderId: {type: [string, 'null'], format: uuid}
        printerId: {type: [string, 'null'], format: uuid}
        data: {type: object, additionalProperties: true}
      required: [kind, since, orderId, printerId, data]
      additionalProperties: false
    User:
      type: object
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        displayName: {type: string}
        email: {type: [string, 'null']}
        phone: {type: [string, 'null']}
        role: {$ref: '#/components/schemas/Role'}
        avatarUrl: {type: [string, 'null'], format: uri}
        disabled: {type: boolean}
        createdAt: {type: string, format: date-time}
        version: {type: integer}
      required: [id, username, displayName, email, phone, role, avatarUrl, disabled, createdAt, version]
      additionalProperties: false
    Me:
      type: object
      properties:
        user: {$ref: '#/components/schemas/User'}
        locale: {type: string}
        permissions:
          type: array
          items: {$ref: '#/components/schemas/Permission'}
          description: 按文档 1 §2.2 和开关算好的
      required: [user, locale, permissions]
      additionalProperties: false
    AuthMethods:
      type: object
      properties:
        register:
          type: array
          items: {type: string, enum: [OIDC, OPEN, INVITE, PHONE]}
        oidc:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              displayName: {type: string}
            required: [id, displayName]
            additionalProperties: false
        emailDomains:
          type: [array, 'null']
          items: {type: string}
        setupRequired: {type: boolean}
      required: [register, oidc, emailDomains, setupRequired]
      additionalProperties: false
    Invite:
      type: object
      properties:
        id: {type: string, format: uuid}
        label: {type: string}
        maxUses: {type: integer}
        usedCount: {type: integer}
        expiresAt: {type: [string, 'null'], format: date-time}
        revokedAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
        code: {type: string, description: 只在创建时返回一次}
      required: [id, label, maxUses, usedCount, expiresAt, revokedAt, createdAt]
      additionalProperties: false
    Daemon:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        online: {type: boolean}
        daemonVersion: {type: [string, 'null']}
        protocolVersion: {type: [string, 'null']}
        platform: {type: [string, 'null']}
        lastSeenAt: {type: [string, 'null'], format: date-time}
        revokedAt: {type: [string, 'null'], format: date-time}
        keyFingerprint: {type: string}
        printerCount: {type: integer}
        needsUpgrade: {type: boolean}
        version: {type: integer}
      required:
      - id
      - name
      - online
      - daemonVersion
      - protocolVersion
      - platform
      - lastSeenAt
      - revokedAt
      - keyFingerprint
      - printerCount
      - needsUpgrade
      - version
      additionalProperties: false
    Enrollment:
      type: object
      properties:
        id: {type: string, format: uuid}
        expiresAt: {type: string, format: date-time}
        commands:
          type: object
          properties:
            linux: {type: string}
            windows: {type: string}
            docker: {type: string}
          required: [linux, windows, docker]
          additionalProperties: false
          description: 一次性令牌放在环境变量里（MSG-ENR）；只在创建时返回
      required: [id, expiresAt, commands]
      additionalProperties: false
    FormFieldType: {type: string, enum: [text, textarea, single, multi, number]}
    FormField:
      type: object
      properties:
        id: {type: string}
        label: {type: string}
        type: {$ref: '#/components/schemas/FormFieldType'}
        required: {type: boolean}
        options:
          type: array
          items: {type: string}
      required: [id, label, type, required]
      additionalProperties: false
    Form:
      type: object
      properties:
        versionId: {type: string, format: uuid}
        fields:
          type: array
          items: {$ref: '#/components/schemas/FormField'}
        createdAt: {type: string, format: date-time}
      required: [versionId, fields, createdAt]
      additionalProperties: false
    SettingsSection:
      type: object
      properties:
        section:
          type: string
          enum: [general, ui, camera, submit, queue, revision, mapping, printing, pickup, files, accounts, notifications,
            ops]
        values: {type: object, additionalProperties: true, description: 键是 CFG 参数的英文名；定义表见代码，和文档 1 §6 一一对应}
        defaults: {type: object, additionalProperties: true}
        version: {type: integer}
        updatedAt: {type: [string, 'null'], format: date-time}
        updatedBy:
          oneOf:
          - {$ref: '#/components/schemas/Person'}
          - {type: 'null'}
      required: [section, values, defaults, version, updatedAt, updatedBy]
      additionalProperties: false
    PublicSettings:
      type: object
      properties:
        orgName: {type: string}
        timezone: {type: string}
        defaultLocale: {type: string}
        overviewPublic: {type: boolean}
        guestStream: {type: boolean}
      required: [orgName, timezone, defaultLocale, overviewPublic, guestStream]
      additionalProperties: false
    AuditEntry:
      type: object
      properties:
        id: {type: integer}
        at: {type: string, format: date-time}
        actorType: {type: string, enum: [USER, SYSTEM, DAEMON, PRINTER]}
        actor:
          oneOf:
          - {$ref: '#/components/schemas/Person'}
          - {type: 'null'}
        action: {type: string}
        targetType: {type: [string, 'null']}
        targetId: {type: [string, 'null']}
        before: {}
        after: {}
        reason: {type: [string, 'null']}
        result: {type: string, enum: [OK, FAILED, DENIED]}
        requestId: {type: [string, 'null']}
        ip: {type: [string, 'null']}
      required: [id, at, actorType, actor, action, targetType, targetId, before, after, reason, result, requestId, ip]
      additionalProperties: false
    Notification:
      type: object
      properties:
        id: {type: string, format: uuid}
        event: {type: string}
        orderId: {type: [string, 'null'], format: uuid}
        printerId: {type: [string, 'null'], format: uuid}
        data: {type: object, additionalProperties: true}
        createdAt: {type: string, format: date-time}
        readAt: {type: [string, 'null'], format: date-time}
      required: [id, event, orderId, printerId, data, createdAt, readAt]
      additionalProperties: false
    NotificationPref:
      type: object
      properties:
        event: {type: string}
        channel: {type: string, enum: [IN_APP, EMAIL, FEISHU]}
        enabled: {type: boolean}
        locked: {type: boolean, description: 驳回、可取件的站内通知关不掉（R-NTF-02）}
      required: [event, channel, enabled]
      additionalProperties: false
  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      schema: {type: string, format: uuid}
    PrinterId:
      name: printerId
      in: path
      required: true
      schema: {type: string, format: uuid}
    VersionN:
      name: n
      in: path
      required: true
      schema: {type: integer, minimum: 1}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    Cursor:
      name: cursor
      in: query
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: API-IDEM
      schema: {type: string, minLength: 8, maxLength: 128}
  responses:
    Problem:
      description: 错误（http-api.md §4）
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Accepted:
      description: 命令已发出（API-ASYNC）
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CommandAccepted'}
    NoContent: {description: 成功}
  securitySchemes:
    session: {type: apiKey, in: cookie, name: pr_session}
security:
- {session: []}
- {}
